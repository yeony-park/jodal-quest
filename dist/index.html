<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>조달의 달인 · 첫 출근 이야기</title>
    <link rel="stylesheet" href="./game.css" />
    <script src="./game.js" defer></script>
  </head>
  <body class="title-mode">
    <main id="game-shell" aria-label="조달의 달인 게임 공간">
  <div id="scene">
    <canvas
      id="world"
      tabindex="0"
      aria-label="사무실 게임 공간. 방향키로 이동하거나 대상 버튼을 누르세요."
    ></canvas>
    <button class="hotspot" id="spot-doc" data-action="go-doc">요청서 · 내 책상</button
    ><button class="hotspot" id="spot-mentor" data-action="go-mentor">선배 김주문</button
    ><button class="hotspot" id="spot-phone" data-action="go-phone">수요기관 연락</button
    ><button class="hotspot" id="spot-terminal" data-action="go-terminal">업무용 모니터</button
    ><button class="hotspot" id="spot-supplier" data-action="go-supplier">
      욘 대리 · 기업 담당자
    </button>
    <button class="hotspot" id="spot-elevator" data-action="go-elevator">엘리베이터</button>
    <button class="hotspot" id="spot-officer" data-action="go-officer">계약 담당자</button>
    <button class="hotspot" id="spot-bidroom" data-action="go-bidroom">개찰·계약 자료</button>
  </div>
  <div class="hud" id="game-hud">
    <div class="inventory" aria-label="인벤토리 · 7칸">
      <span class="inventory-label">조달달의 가방 · 7칸</span>
      <div class="inventory-slots" id="inventory-slots"></div>
    </div>
    <aside class="minimap" aria-label="사무실 미니맵">
      <svg viewBox="0 0 188 112" role="img" aria-label="책상과 현재 플레이어 위치">
        <rect
          x="4"
          y="4"
          width="180"
          height="104"
          rx="9"
          fill="#e5edd5"
          stroke="#aaba94"
          stroke-width="2"
        />
        <g id="mini-layout"></g>
        <circle id="mini-target" r="5" fill="#e6ae43" stroke="#fff6cf" stroke-width="2" />
        <circle id="mini-player" r="4" fill="#32765e" stroke="white" stroke-width="2" /></svg
      ><span class="map-caption" id="location"></span
      ><span class="map-note">초록 · 나 / 노랑 · 다음 목표</span>
    </aside>
    <div class="top-controls">
      <button
        class="hud-button quest-toggle"
        id="quest-toggle"
        data-action="quests"
        aria-controls="quest-panel"
        aria-expanded="false"
      >
        <span class="quest-icon" aria-hidden="true"></span>퀘스트<span id="quest-count"
          >0 / 6</span
        ></button
      ><button class="hud-button" id="sound-toggle" data-action="sound" aria-label="사운드 설정">
        ♫ 소리</button
      ><button class="hud-button help-button" data-action="help">?</button>
    </div>
    <aside
      class="notebook"
      id="quest-panel"
      aria-label="김주문이 손으로 적어 준 퀘스트 노트"
      hidden
    >
      <button class="close-note" data-action="quests" aria-label="퀘스트 노트 접기">×</button>
      <p class="note-to">달달 주무관에게,</p>
      <h2 id="quest-title"></h2>
      <p id="quest-desc"></p>
      <ul class="todo" id="todos"></ul>
      <div class="note-ps">추신. <span id="memo"></span></div>
      <div class="signature">차근차근 해 봅시다.<br />김주문 씀</div>
      <div class="note-progress" id="steps" aria-label="퀘스트 진행"></div>
      <span id="quest-label" class="screen-reader"></span
      ><button class="primary" data-action="guide" id="guide-button">다음 목표로 이동</button>
    </aside>
    <div class="goal-bar">
      <span id="current-goal" aria-live="polite"></span>
      <button data-action="guide" id="quick-guide">다음 목표로 이동</button>
      <button data-action="glossary" aria-label="조달 용어 수첩 열기">용어 수첩</button>
    </div>
    <div class="bottom-controls">
      <span id="level-badge">Lv. 1</span><span id="player-label"></span
      ><span class="key-help"
        ><kbd>WASD</kbd> 이동 · <kbd>Space</kbd> 대화 · <kbd>Q</kbd> 노트</span
      >
    </div>
    <div class="mobile-controls" aria-label="이동 버튼">
      <button data-move="left" aria-label="왼쪽 이동">←</button
      ><button data-move="up" aria-label="위로 이동">↑</button
      ><button data-move="down" aria-label="아래로 이동">↓</button
      ><button data-move="right" aria-label="오른쪽 이동">→</button><button data-action="interact" aria-label="가까운 대상과 대화">대화</button>
    </div>
    <span id="save-status" role="status">퀘스트 완료 시 자동 저장</span
    ><span id="scene-time" class="screen-reader"></span>
  </div>
</main>

    <section class="title-screen" id="title-screen" aria-labelledby="game-title">
  <button class="title-audio" data-action="sound">♫ 사운드 설정</button>
  <div class="title-card">
    <div class="title-eyebrow">첫 출근, 첫 번째 의뢰</div>
    <div class="game-logo">
      <h1 id="game-title"><span>조달의</span>달인</h1>
    </div>
    <div class="title-chars" id="title-chars"></div>
    <p class="title-copy">첫 업무가 도착했어요.<br />조달달 주무관, 준비됐나요?</p>
    <div class="title-buttons">
      <button class="primary" data-action="start-new">게임 시작하기</button
      ><button class="secondary" id="continue-button" data-action="continue" hidden>
        이어서 하기
      </button>
    </div>
    <p class="title-footer">
      Space로 대화 · 클릭 또는 방향키로 이동<br />가상의 기관과 인물을 활용한 공공조달 체험 게임
    </p>
  </div>
</section>

    <section
  class="speech"
  id="speech"
  role="dialog"
  aria-labelledby="speech-name"
  aria-describedby="speech-text"
  hidden
  tabindex="-1"
>
  <div class="speech-name" id="speech-name">김주문</div>
  <div class="speech-portrait" id="speech-portrait"></div>
  <p class="speech-text" id="speech-text"></p>
  <button class="speech-next" data-action="talk-next">
    <span id="speech-count"></span> <kbd>Space</kbd> <span id="speech-hint">문장 모두 보기</span> ▾
  </button>
</section>

    <div class="overlay" id="overlay" hidden>
  <section
    class="modal"
    id="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    tabindex="-1"
  ></section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

  </body>
</html>
