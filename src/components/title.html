<section class="title-screen" id="title-screen" aria-labelledby="game-title">
  <button class="title-help" data-action="title-help" aria-label="게임 도움말" aria-haspopup="dialog">?</button>
  <button class="title-audio" data-action="sound">♫ 사운드 설정</button>
  <button id="title-enter" hidden>▶ 타이틀 재생</button>
  <div class="title-card">
    <div class="game-logo">
      <h1 id="game-title" aria-label="조달의 달인">
        <svg viewBox="-2 -2 88 21" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
          <defs>
            <path id="logo-jo" d="M1 1h12v2H8v2h2v2h2v1h2v2h-3V9H9V7H7V6H6v1H4v2H2v1H0V8h2V7h2V5h2V3H1z M6 10h2v4h6v2H0v-2h6z"/>
            <path id="logo-dal" d="M0 0h8v2H2v4h6v2H0z M10 0h2v3h3v2h-3v4h-2z M1 9h12v5H3v1h10v2H1v-5h10v-1H1z"/>
            <path id="logo-ui" d="M2 1h6v2H2z M0 3h2v5H0z M8 3h2v5H8z M2 8h6v2H2z M0 13h11v2H0z M12 0h2v17h-2z"/>
            <path id="logo-in" d="M2 1h6v2H2z M0 3h2v5H0z M8 3h2v5H8z M2 8h6v2H2z M12 0h2v12h-2z M1 12h3v3h10v2H1z"/>
          </defs>
          <use href="#logo-jo"/><use href="#logo-dal" x="17"/><use href="#logo-ui" x="34"/>
          <use href="#logo-dal" x="53"/><use href="#logo-in" x="70"/>
        </svg>
      </h1>
    </div>
    <div class="title-chars" id="title-chars"></div>
    <div class="title-buttons">
      <button class="primary" id="title-start" data-action="start-new">게임 시작하기</button
      ><button class="secondary" id="continue-button" data-action="continue" hidden>
        이어서 하기
      </button>
    </div>
  </div>
</section>
